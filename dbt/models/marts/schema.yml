version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships: {to: ref('dim_customers'), field: customer_id}
      - name: purchase_date_key
        tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: review_score
        tests:
          - accepted_values: {values: [1, 2, 3, 4, 5], quote: false}

  - name: fct_order_items
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships: {to: ref('fct_orders'), field: order_id}
      - name: product_id
        tests:
          - relationships: {to: ref('dim_products'), field: product_id}
      - name: seller_id
        tests:
          - relationships: {to: ref('dim_sellers'), field: seller_id}

  - name: dim_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: dim_products
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: dim_sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]